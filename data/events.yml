events:
  - id: taika-reform
    date: "0645"
    title: 大化の改新
    category: 政治
    description: 中大兄皇子と中臣鎌足が蘇我氏を滅ぼし、公地公民制への移行を進めた。
    source: https://ja.wikipedia.org/wiki/%E5%A4%A7%E5%8C%96%E3%81%AE%E6%94%B9%E6%96%B0

  - id: heisenji-founding
    date: "0717"
    title: 白山平泉寺開創
    category: 文化
    description: 越前の僧泰澄が白山の妙理大菩薩を感得し、白山禅定道の越前側登拝口に平泉寺を建立したと伝わる。平安期以降は比叡山延暦寺の末寺として勢力を拡大し、北陸の白山信仰の中心となる。中世最盛期には数千の坊院と僧兵を擁する一大宗教都市を形成し、加賀の白山中宮・美濃側登拝口の長滝寺と並ぶ三馬場の一つに数えられた。

  - id: heian-relocation
    date: "0794"
    title: 平安京遷都
    category: 政治
    description: 桓武天皇が長岡京から平安京（現在の京都）に都を遷した。

  - id: tale-of-genji
    date: "1008"
    title: 源氏物語成立
    category: 文化
    description: 紫式部が著した、世界最古級の長編小説。

  - id: kamakura-shogunate
    date: "1192"
    title: 鎌倉幕府成立
    category: 政治
    description: 源頼朝が征夷大将軍となり、武家政権が確立した。

  - id: mongol-invasion-bunei
    date: "1274"
    title: 文永の役
    category: 戦乱
    description: 元・高麗連合軍による一度目の日本侵攻。鎌倉幕府軍が撃退した。

  - id: muromachi-shogunate
    date: "1338"
    title: 室町幕府成立
    category: 政治
    description: 足利尊氏が征夷大将軍に任命され、京都に幕府を開いた。

  - id: murakami-suigun-emergence
    date: "1349"
    title: 村上水軍、史料初出
    category: 政治
    description: 「野嶋」(能島) の海賊が幕府の船を警固したと『海賊大将軍村上家文書』等に記録される。系図上の起源は平安末期に伊予越智大島へ移った村上定国に遡るが、史料に芸予諸島の海上勢力として現れるのはこの南北朝期から。15 世紀初頭には能島・来島・因島の三島村上に分立し、瀬戸内の制海権を握る最大の海上勢力となる。

  - id: wakasa-takeda-founding
    date: "1440"
    title: 若狭武田氏成立
    category: 政治
    description: 安芸武田氏の出身武田信栄が、将軍足利義教の命で大和に出陣した一色義貫を陣中で誅殺。恩賞として若狭守護に補任され、甲斐武田氏とは別系統の若狭武田氏が始まる。信栄は就任直後に急死し弟信賢が継承、以後約 140 年にわたり若狭一国を支配することとなる。

  - id: kakitsu-incident
    date: "1441-06"
    title: 嘉吉の乱
    category: 戦乱
    description: 播磨守護赤松満祐が 6 代将軍足利義教を自邸の宴席に招き暗殺。将軍権威は急速に失墜し、守護大名間の抗争が激化する遠因となった。

  - id: kyotoku-war
    date: "1454"
    title: 享徳の乱勃発
    category: 戦乱
    description: 鎌倉公方足利成氏が関東管領上杉憲忠を謀殺し、関東一円が古河公方方と上杉方に分裂。応仁の乱に先駆けて約 28 年続く東国の大乱となった。

  - id: yoshimi-heir
    date: "1464"
    title: 足利義視を後継指名
    category: 政治
    description: 嗣子のなかった 8 代将軍足利義政が、僧籍にあった弟の義視を還俗させて後継に指名。細川勝元が後見役となった。

  - id: yoshihisa-birth
    date: "1465"
    title: 足利義尚誕生
    category: 政治
    description: 義政の正室日野富子が義尚を産む。富子は山名宗全を後見に立てて義尚の擁立を図り、義視を推す細川勝元と将軍家後継を巡って対立。これが東西両軍対立の主軸となった。

  - id: goryo-battle
    date: "1467-01"
    title: 御霊合戦
    category: 戦乱
    description: 畠山家督を巡り畠山政長と畠山義就が京都・上御霊神社周辺で衝突。山名宗全が義就を支援したことで対立が表面化し、応仁の乱の前哨戦となった。

  - id: onin-war
    date: "1467-05"
    title: 応仁の乱本格化(上京合戦)
    category: 戦乱
    description: 細川勝元率いる東軍と山名宗全率いる西軍が京都市街で全面衝突。室町幕府の管領家・守護大名の大半を二分する 11 年に及ぶ大乱の幕が開き、戦国時代の起点となった。

  - id: ouchi-entry
    date: "1467-08"
    title: 大内政弘、西軍として上洛
    category: 戦乱
    description: 周防・長門・豊前・筑前の守護大内政弘が水軍を含む 3 万の大軍を率いて入京し西軍に合流。劣勢だった西軍が息を吹き返したことで戦線は膠着状態に陥り、乱の長期化を決定づけた。

  - id: yoshimi-defects-west
    date: "1468-11"
    title: 足利義視、西軍へ出奔
    category: 政治
    description: 細川勝元の後見を受けて東軍にいた足利義視が、義政・義尚との対立から比叡山を経て西軍陣営へ走る。西軍は義視を将軍として「西幕府」を構え、京都に二人の将軍が並び立つ異常事態となった。

  - id: asakura-defection
    date: "1471-05"
    title: 朝倉孝景、東軍へ寝返り
    category: 政治
    description: 西軍の有力武将だった朝倉孝景が、足利義政から越前守護職を約束されて東軍に転じる。主家斯波氏の守護代から守護への下剋上を果たし、戦国大名朝倉氏の礎を築いた。

  - id: yamana-souzen-death
    date: "1473-03"
    title: 山名宗全死去
    category: 政治
    description: 西軍総帥の山名宗全(持豊)が病没。享年 70。乱の主因となった東西の両総帥がほぼ同時期に世を去り、両軍の戦意は急速に衰えた。

  - id: hosokawa-katsumoto-death
    date: "1473-05"
    title: 細川勝元死去
    category: 政治
    description: 東軍総帥の細川勝元が病没。享年 44。山名宗全の死から 2 か月足らずでの相次ぐ大物の死は、応仁の乱を終息へと向かわせた。

  - id: yoshihisa-shogun
    date: "1473-12"
    title: 足利義尚、9 代将軍就任
    category: 政治
    description: 足利義政が将軍職を 9 歳の義尚に譲位。実権は依然として義政・富子が握り、室町幕府の権威低下を象徴する代替わりとなった。

  - id: onin-war-end
    date: "1477-11"
    title: 応仁の乱終結
    category: 戦乱
    description: 大内政弘が幕府から周防・長門・豊前・筑前 4 か国の守護職を安堵されて領国へ撤退し、畠山義就らも京を離脱。11 年にわたる京都の戦乱は事実上終結したが、戦火は地方へ拡散し戦国の世が本格化した。

  - id: yamashiro-ikki
    date: "1485-12"
    title: 山城国一揆
    category: 政治
    description: 山城南部の国人衆と農民が、なお対峙を続けていた畠山政長・義就両軍の撤兵を要求して蜂起。両畠山軍を退去させ、約 8 年間にわたる国人による自治を実現した。応仁の乱後の幕府権威失墜を象徴する事件。

  - id: kaga-ikko-ikki
    date: "1488-06"
    title: 加賀一向一揆
    category: 戦乱
    description: 本願寺門徒の国人・農民が加賀守護富樫政親を高尾城に攻め滅ぼす。以後約 100 年にわたり加賀は「百姓ノ持タル国」として一向宗門徒の自治下に置かれた。

  - id: hojo-soun-izu
    date: "1493"
    title: 北条早雲、伊豆討入り
    category: 戦乱
    description: 駿河今川氏に身を寄せていた伊勢盛時(後の北条早雲)が、堀越公方足利政知の子茶々丸を討つべく伊豆韮山の堀越御所を急襲。以後 5 年がかりで伊豆一国を制圧し、戦国大名後北条氏五代の礎を築いた。戦国時代の開幕を象徴する事件と位置づけられる。

  - id: hanagura-rebellion
    date: "1536-06"
    title: 花倉の乱
    category: 戦乱
    description: 駿河今川氏当主氏輝と次弟彦五郎が同日に急死した跡目を巡り、庶兄玄広恵探と五男栴岳承芳が抗争。母方の太原雪斎の支援を得た承芳が勝利し、還俗して今川義元を名乗り家督を継いだ。

  - id: shingen-banishment
    date: "1541-06"
    title: 武田晴信、父信虎を追放
    category: 政治
    description: 駿河の今川義元を訪問中だった父信虎の帰国経路を、嫡男武田晴信(信玄)が国境で封鎖。重臣板垣信方・甘利虎泰らを味方につけた無血クーデターで信虎を駿河に幽閉同然とし、甲斐武田家の家督を奪取した。

  - id: kawagoe-night-battle
    date: "1546-04"
    title: 河越夜戦
    category: 戦乱
    description: 河越城を包囲する関東管領山内上杉憲政・扇谷上杉朝定・古河公方足利晴氏の連合軍 8 万に対し、北条氏康が 8 千の手勢で夜襲を敢行。扇谷上杉朝定を討ち取り山内上杉氏を関東から駆逐するに等しい大勝利を収めた。後北条氏の関東制覇を決定づけた合戦で、日本三大奇襲の一つに数えられる。

  - id: kososun-alliance
    date: "1554"
    title: 甲相駿三国同盟
    category: 外交
    description: 1552 年から 1554 年にかけて武田・北条・今川の三家が婚姻を重ね、相互不可侵の和平体制を成立させる。武田信玄は北信濃へ、北条氏康は関東へ、今川義元は西へと矛先を集中できるようになり、後の桶狭間や川中島の前提条件を作った同盟となった。

  - id: kantokanrei-uesugi
    date: "1561-03"
    title: 長尾景虎、関東管領上杉氏を相続
    category: 政治
    description: 越後守護代長尾景虎が、北条氏に追われ落ち延びていた山内上杉憲政から上杉姓と関東管領職を譲られ、鎌倉鶴岡八幡宮で就任の儀を執行。以後「上杉政虎」と名乗り(さらに改名し謙信となる)、北条氏との関東における主導権争いが本格化した。

  - id: kawanakajima-4
    date: "1561-09"
    title: 第四次川中島の戦い
    category: 戦乱
    description: 武田信玄と上杉政虎(謙信)が信濃川中島で 12 年に及ぶ抗争中もっとも激しく衝突。妻女山に布陣した謙信を信玄が啄木鳥戦法で挟撃しようとするも見破られ、本陣同士が真正面から激突。武田方は信玄の弟信繁・軍師山本勘助を失う痛手を被ったが、最終的に両軍痛み分けで終わった。

  - id: shingen-suruga-invasion
    date: "1568-12"
    title: 武田信玄、駿河侵攻
    category: 戦乱
    description: 桶狭間で義元を失い衰退する今川氏真の駿河に、武田信玄が三国同盟を一方的に破棄して侵攻。電撃的に駿府を占領した。これを境に北条氏康は同盟を解消して上杉謙信と組み(越相同盟)、徳川家康も遠江へ侵攻するなど東国の勢力図が一変した。

  - id: imagawa-end
    date: "1569-05"
    title: 戦国大名今川氏滅亡
    category: 政治
    description: 武田・徳川の挟撃を受けた今川氏真が遠江掛川城を徳川家康に開城して降伏。氏真は妻の実家である小田原北条氏のもとへ逃れ、駿河・遠江を本領とした戦国大名としての今川氏は滅亡した。氏真自身は後に家康に庇護され、公家として存命する。

  - id: mikatagahara
    date: "1572-12"
    title: 三方ヶ原の戦い
    category: 戦乱
    description: 上洛を目指す武田信玄 2 万 5 千が遠江浜松城を素通りして三方ヶ原台地を西進。挑発に乗った徳川家康・織田援軍 1 万 1 千が追撃したところを台地上で迎撃され大敗。家康は浜松城へ命からがら逃げ帰り、生涯最大の敗戦となった。

  - id: shingen-death
    date: "1573-04"
    title: 武田信玄死去
    category: 政治
    description: 三方ヶ原大勝後さらに西進し三河野田城を攻略していた信玄が病状悪化により撤退。甲斐への帰路、信濃伊那駒場で没した(享年 53)。信玄の死は「3 年間秘匿せよ」との遺言にもかかわらず諸国に伝わり、信長は将軍義昭追放と朝倉・浅井攻めへと一気に転じる。家督は四男勝頼が継承。

  - id: kenshin-death
    date: "1578-03"
    title: 上杉謙信死去・御館の乱
    category: 政治
    description: 関東出陣の準備中だった上杉謙信が春日山城で急逝(享年 49)。後継を指名していなかったため、養子の景勝(長尾政景の子)と景虎(北条氏康の子)が家督を争う「御館の乱」が勃発。1579 年に景勝が勝利するが、上杉氏は越後・北信濃の支配を維持するのが精一杯となり、織田信長の北陸進出を許す結果となった。

  - id: azuchi-castle
    date: "1576"
    title: 安土城築城開始
    category: 文化
    description: 織田信長が琵琶湖畔に天守を備えた本格的な近世城郭を築いた。

  - id: oyama-conference
    date: "1600-07"
    title: 三成挙兵・小山評定
    category: 政治
    description: 会津の上杉景勝討伐に向かっていた徳川家康のもとに、石田三成が毛利輝元を西軍総大将に擁立して挙兵したとの報が届く。下野小山で諸将を集めた家康は反転して三成と決戦することを決め、東西両軍が形成された。

  - id: asainawate
    date: "1600-08"
    title: 浅井畷の戦い
    category: 戦乱
    description: 関ヶ原本戦に先立つ北陸の前哨戦。会津征伐に呼応して南下する東軍の前田利長 2 万 5 千が西軍についた丹羽長重の加賀小松城を攻めるも落とせず引き揚げる途上、長重の伏兵が浅井畷で奇襲。狭隘な畦道で前田勢に痛手を負わせ「北陸の関ヶ原」と称された。関ヶ原本戦の敗報で長重は降伏し、戦後改易された。

  - id: sekigahara
    date: "1600-09-15"
    title: 関ヶ原の戦い
    category: 戦乱
    description: 美濃関ヶ原で東軍(徳川家康)約 7 万 5 千と西軍(石田三成・宇喜多秀家、総大将は大坂城の毛利輝元)約 8 万が激突。松尾山の小早川秀秋が西軍を裏切って大谷吉継を急襲したことで西軍は総崩れ、わずか半日で東軍が勝利した。三成・小西行長・安国寺恵瓊は京で処刑。毛利輝元は大坂城を開け渡し、領地は周防・長門 2 か国に削減された。

  - id: ogaki-castle-fall
    date: "1600-09-23"
    title: 大垣城開城
    category: 戦乱
    description: 関ヶ原本戦前夜に石田三成が出陣したあと、福原長堯ら 7,500 が残って籠もる西軍最大の拠点大垣城に、東軍が攻め寄せる。本戦敗報後も 1 週間粘ったが、9 月 23 日に松平康長へ降伏開城した。三成が籠城を選ばず野戦を選んだ判断が本戦の帰趨を決めたとの評価が後世広く議論される。

  - id: matsuyama-castle
    date: "1602"
    title: 加藤嘉明、伊予松山城築城開始
    category: 政治
    description: 関ヶ原の戦功で伊予半国 20 万石に加増された賤ヶ岳七本槍の加藤嘉明が、それまでの正木城が手狭となったため勝山に新城の築城を開始。足立重信を普請奉行に、近世城郭としては最大級の連立式天守を計画した。1627 年に嘉明は会津へ転封となり、25 年かけて松平氏の代で完成。現存十二天守の一つで重要文化財。

  - id: nagoya-castle
    date: "1612"
    title: 名古屋城天守完成
    category: 文化
    description: 1610 年閏 2 月、徳川家康が大坂の豊臣方への押さえとして 9 男義直の尾張藩の居城を新造する天下普請を開始。加藤清正・福島正則ら西国 20 大名が動員され、天守台石垣は清正自ら 3 か月足らずで築き上げた。1612 年 12 月に大天守が完成、本丸御殿は 1615 年に完成。金鯱を頂く層塔型 5 重 5 階の大天守は近世城郭建築の頂点とされた(1945 年に空襲で焼失、1959 年再建)。

  - id: matsue-castle
    date: "1611"
    title: 堀尾吉晴、松江城完成
    category: 文化
    description: 関ヶ原の戦功で出雲・隠岐 24 万石を与えられた堀尾吉晴が、月山富田城に代わる新たな本拠として宍道湖畔の亀田山に築城を開始(1607 年)。1611 年に天守が完成し吉晴も同年 6 月に没した。望楼型 5 重 6 階の黒い実戦的天守は現存十二天守の一つで、2015 年に国宝に再指定された。

  - id: edo-shogunate
    date: "1603"
    title: 江戸幕府成立
    category: 政治
    description: 徳川家康が征夷大将軍に任命され、江戸に幕府を開いた。

  - id: hokoji-bell
    date: "1614-07"
    title: 方広寺鐘銘事件
    category: 政治
    description: 豊臣秀頼が再建した京都方広寺大仏殿の鐘銘「国家安康・君臣豊楽」を、家康の名を分断し豊臣の繁栄を願うものと幕府が難詰。家康が大坂方への開戦口実を得て、大坂の陣の発端となった。

  - id: osaka-winter
    date: "1614-11"
    title: 大坂冬の陣
    category: 戦乱
    description: 徳川方 20 万が大坂城を包囲。真田信繁(幸村)が南面に構築した「真田丸」での迎撃で寄せ手に大損害を与えるなど豊臣方の籠城戦は健闘した。12 月、家康は大砲で本丸を威嚇しつつ和議を結び、外堀(さらに事実上の内堀)を埋め立てさせて大坂城を裸城同然とした。

  - id: osaka-summer
    date: "1615-05"
    title: 大坂夏の陣・豊臣氏滅亡
    category: 戦乱
    description: 堀を失った大坂城を再び徳川方が攻囲。真田信繁の家康本陣突撃などの奮戦も及ばず、5 月 8 日 (慶長 20 年 5 月 8 日) 大坂城は炎上落城。豊臣秀頼・淀殿は自害し、豊臣氏は滅亡した。応仁の乱以来約 150 年続いた戦乱の世が完全に終わり、徳川による天下統一が確定した。

  - id: ikkoku-ichijo
    date: "1615-06"
    title: 一国一城令・武家諸法度
    category: 政治
    description: 大坂の陣終結直後、幕府は諸大名に居城以外の城の破却を命じる一国一城令を発し、続いて武家諸法度を制定して大名統制の基本法を定めた。続けて禁中並公家諸法度で朝廷も統制下に置き、徳川による泰平の体制が固まった。

  - id: niwa-shirakawa
    date: "1627"
    title: 丹羽長重、白河藩 10 万 7 千石に加増
    category: 政治
    description: 関ヶ原での改易後、徳川秀忠の信任を得た丹羽長重は 1603 年に常陸古渡 1 万石で大名復帰し、棚倉藩を経て陸奥白河藩 10 万 7 千石に加増。築城・城下町整備の才で知られ、自ら縄張りした白河小峰城は奥州の要衝として近世初頭の名城に数えられた。長秀以来の丹羽家は譜代格として明治まで存続する。

  - id: great-meireki-fire
    date: "1657-03-02"
    title: 明暦の大火
    category: 災害
    description: 江戸の大半を焼失させた大火災。死者は十万人を超えたとされる。

  - id: sakoku-completion
    date: "1639"
    title: ポルトガル船来航禁止(鎖国体制完成)
    category: 外交
    description: 江戸幕府がポルトガル船の来航を禁止し、いわゆる鎖国体制が完成した。

  - id: genroku-culture
    date: "1700"
    title: 元禄文化の隆盛
    category: 文化
    description: 上方を中心に町人文化が花開き、近松門左衛門・井原西鶴らが活躍した。

  - id: kyoho-reforms
    date: "1716"
    title: 享保の改革
    category: 経済
    description: 徳川吉宗が幕府財政の再建を目指し、年貢制度の見直しなどを進めた。

  - id: perry-arrival
    date: "1853-07-08"
    title: ペリー来航
    category: 外交
    description: 米国東インド艦隊司令官ペリーが浦賀に来航し、開国を要求した。

  - id: meiji-restoration
    date: "1868"
    title: 明治維新
    category: 政治
    description: 王政復古の大号令により幕府が倒れ、明治新政府が誕生した。

  - id: russo-japanese-war
    date: "1904-02"
    title: 日露戦争開戦
    category: 戦乱
    description: 満州・朝鮮半島の権益を巡り、日本とロシア帝国が開戦した。

  - id: great-kanto-earthquake
    date: "1923-09-01"
    title: 関東大震災
    category: 災害
    description: マグニチュード 7.9 級の地震が関東地方を襲い、十万人以上が犠牲となった。

  - id: pacific-war-end
    date: "1945-08-15"
    title: 太平洋戦争終結
    category: 戦乱
    description: 玉音放送によりポツダム宣言の受諾が国民に告げられ、第二次世界大戦が終結した。

  - id: san-francisco-treaty
    date: "1951-09-08"
    title: サンフランシスコ平和条約調印
    category: 外交
    description: 連合国 48 か国と平和条約に調印。翌 1952 年 4 月 28 日の発効をもって日本は主権を回復した。

  - id: tokyo-olympics-1964
    date: "1964-10-10"
    title: 東京オリンピック開幕
    category: 文化
    description: アジア初の夏季オリンピックとして開催され、戦後復興の象徴となった。

  - id: bubble-economy-burst
    date: "1991"
    title: バブル経済崩壊
    category: 経済
    description: 株価・地価の急落により景気後退が始まり、長期の停滞期に入った。

  - id: great-east-japan-earthquake
    date: "2011-03-11"
    title: 東日本大震災
    category: 災害
    description: マグニチュード 9.0 の地震と津波により甚大な被害が発生した。

  - id: nagai-shinzaemon
    date: "1517"
    title: 長井新左衛門尉、長井姓を拝領
    category: 政治
    description: 京都妙覚寺の僧から還俗し油商人を経て美濃へ下った松波庄五郎(西村勘九郎)が、守護代斎藤氏の重臣長井家から長井姓を許され美濃国政の中枢に入る。彼の子が後の斎藤道三で、美濃の国盗りは父子二代がかりで進められたとする「国盗り二代説」が現在の通説。

  - id: dosan-mino-takeover
    date: "1542"
    title: 斎藤道三、土岐頼芸を追放し美濃を掌握
    category: 政治
    description: 父の遺業を継いだ斎藤利政(道三)が美濃守護土岐頼芸の居城大桑城を攻め落とし、頼芸父子を尾張へ追放。守護代から事実上の美濃国主に成り上がり、戦国期屈指の下剋上を完成させた。「美濃のマムシ」の異名はこの過程に由来する。

  - id: kanouguchi
    date: "1547-09"
    title: 加納口の戦い
    category: 戦乱
    description: 土岐頼純を支援する尾張の織田信秀が大軍で美濃に侵攻。稲葉山城下の加納口で撤退する織田勢の背後を斎藤道三が衝き、信秀の弟織田信康ら 5 千を討ち取る大勝利を収めた。これを機に道三と信秀は和睦に転じ、信秀嫡男信長と道三娘濃姫の婚姻が進められた。

  - id: nobunaga-nohime
    date: "1549"
    title: 織田信長・濃姫婚姻(斎藤=織田同盟)
    category: 政治
    description: 加納口の戦い後の和睦に基づき、織田信秀の嫡男信長(15 歳)が斎藤道三の娘濃姫(帰蝶)を正室に迎える政略結婚が成立。仲介役は平手政秀。これにより信長は背後の美濃を安定させ、後の桶狭間出陣を可能にする戦略的基盤を得た。

  - id: nagaragawa
    date: "1556-04"
    title: 長良川の戦い・斎藤道三敗死
    category: 戦乱
    description: 嫡男義龍に家督を譲った後も実権を握ろうとした道三と、これに反発した義龍が長良川を挟んで激突。兵力 10 倍とも言われる義龍勢に道三勢は崩れ、4 月 20 日(弘治 2 年、ユリウス暦 5 月 28 日)に道三は討死した。婿の信長は救援に駆けつけたが間に合わず、以後信長は道三の遺言を奉じて美濃攻略に転じる。

  - id: nochiseyama
    date: "1522"
    title: 武田元光、後瀬山城築城
    category: 政治
    description: 若狭武田氏 5 代当主武田元光が小浜湾を見下ろす後瀬山に山城を築き、新たな本拠とする。守護所(武田氏館)を山麓に置く中世山城の典型で、若狭最大級の城郭。以後 3 代にわたり若狭武田氏の拠点となるが、当主が在京して幕政に関与する一方で守護代逸見氏や粟屋氏ら被官の内紛が激化し、戦国期を通じて家中統制に苦慮することとなる。

  - id: itsukushima
    date: "1555-10"
    title: 厳島の戦い
    category: 戦乱
    description: 安芸の毛利元就が大内氏を簒奪した陶晴賢を厳島で奇襲し撃滅。来島・能島・因島の村上水軍を味方につけ瀬戸内の制海権を握ったことが奇襲成功の決め手となり、毛利氏が中国地方の覇者へ躍進する起点となった。

  - id: kuniyoshi-castle
    date: "1556"
    title: 国吉城築城・粟屋勝久の独立保持
    category: 政治
    description: 若狭武田氏家臣の粟屋勝久が、越前との国境近い若狭三方郡佐柿に山城を築く。永禄 6 年(1563)から毎年朝倉氏が若狭へ侵攻するも、勝久は籠城戦でこれを撃退し続けた。1568 年に主君元明が朝倉に拉致された後も降伏命令を拒否し、1570 年の信長越前侵攻時には信長自身が国吉城に入って宿所とし、勝久の武勲を賞賛した。「難攻不落の落ちない城」として知られる。

  - id: okehazama
    date: "1560-06"
    title: 桶狭間の戦い
    category: 戦乱
    description: 織田信長が大軍を率いて尾張に侵攻した今川義元を奇襲で討ち取り、戦国大名としての地位を確立した。

  - id: gifu-castle
    date: "1567"
    title: 信長、稲葉山城攻略・岐阜城と改称
    category: 政治
    description: 西美濃三人衆(稲葉良通・氏家卜全・安藤守就)の内応を得て、織田信長が斎藤龍興の本拠稲葉山城を陥落させる。龍興は伊勢長島へ逃亡。信長は本拠を小牧山城から移し、古代中国で周の文王が岐山から天下を平らげた故事に倣って城下町井ノ口を「岐阜」と改称、「天下布武」の朱印を用い始める。本格的な天下統一構想の起点となった。

  - id: yoshiaki-ichijodani
    date: "1568"
    title: 足利義昭、一乗谷で元服
    category: 政治
    description: 朝倉義景が将軍候補の足利義昭を一乗谷に庇護し、加冠役として元服の儀を執り行った。

  - id: nobunaga-kyoto
    date: "1568"
    title: 信長上洛・足利義昭擁立
    category: 政治
    description: 織田信長が足利義昭を奉じて入京し、義昭を室町幕府 15 代将軍に就かせた。

  - id: asakura-wakasa-invasion
    date: "1568-08"
    title: 朝倉義景、若狭侵攻・武田元明拉致
    category: 戦乱
    description: 家中分裂で混乱する若狭武田氏に対し、当主元明の母方の縁で介入を強める朝倉義景が大軍で若狭へ進駐。後瀬山城に追い詰められた若狭武田氏 9 代武田元明を「保護」名目で一乗谷へ拉致し、若狭支配権を事実上奪取した。若狭武田氏は当主不在のまま家臣団が分裂し、実質的に守護家としての機能を失う。一方、粟屋勝久の国吉城は元明からの降伏命令を拒否して抵抗を継続した。

  - id: kanagasaki-retreat
    date: "1570"
    title: 金ヶ崎の退き口
    category: 戦乱
    description: 越前朝倉攻めの最中、義弟である浅井長政の離反により信長は撤退を余儀なくされた。木下秀吉らが殿軍を務めた。

  - id: hamamatsu-castle
    date: "1570-06"
    title: 徳川家康、浜松城築城
    category: 政治
    description: 武田信玄の西上に備え、徳川家康が本拠を三河岡崎城から遠江引馬城へ移す。引馬の名は「馬を引く=退却」に通じて縁起が悪いとして、かつてこの地にあった荘園名から城下町ごと「浜松」と改称。引馬城の南西に新たな城を築き、以後 29 歳から 45 歳までの 17 年間家康はここを本拠として三方ヶ原・長篠・天正壬午の乱・小牧長久手を戦い抜く。

  - id: anegawa
    date: "1570-07-30"
    title: 姉川の戦い
    category: 戦乱
    description: 織田・徳川連合軍が浅井長政・朝倉景健の連合軍を北近江姉川で破った。

  - id: mori-motonari-death
    date: "1571"
    title: 毛利元就死去
    category: 政治
    description: 安芸の小領主から中国地方の覇者にまで毛利氏を押し上げた元就が郡山城で没した。家督は孫の輝元が継承した。

  - id: enryakuji-burning
    date: "1571"
    title: 比叡山焼き討ち
    category: 戦乱
    description: 朝倉・浅井方を匿ったとして信長が比叡山延暦寺を焼き払い、堂塔伽藍と僧俗多数が失われた。

  - id: sakamoto-castle
    date: "1571"
    title: 坂本城築城開始
    category: 文化
    description: 比叡山焼き討ちの戦功で近江志賀郡を与えられた明智光秀が、琵琶湖畔に水城坂本城の築城に着手した。

  - id: muromachi-end
    date: "1573"
    title: 室町幕府滅亡
    category: 政治
    description: 信長が将軍足利義昭を京都から追放し、約 240 年続いた室町幕府が事実上の終焉を迎えた。

  - id: ichijodani
    date: "1573"
    title: 一乗谷の戦い・朝倉義景滅亡
    category: 戦乱
    description: 信長が越前へ侵攻し、朝倉義景は本拠一乗谷を放棄して逃亡したのち賢松寺で自害。戦国大名としての朝倉氏は滅亡した。

  - id: odani-fall
    date: "1573"
    title: 小谷城落城・浅井長政滅亡
    category: 戦乱
    description: 朝倉氏滅亡の直後、信長は北近江の浅井長政を攻め、長政は小谷城で自害した。

  - id: heisenji-destruction
    date: "1574-04"
    title: 越前一向一揆・平泉寺全山焼失
    category: 戦乱
    description: 朝倉氏滅亡後、信長が越前の支配を任せた桂田長俊への反発から始まった土一揆が一向一揆へ転化し越前全土へ拡大。義景を裏切って自害させたものの一向一揆勢の標的となった朝倉景鏡は平泉寺宝光院に逃れたが、4 月 15 日に和田本覚寺率いる一揆軍が平泉寺本体を急襲。景鏡と僧兵は壊滅し、千を超える坊院を擁した北陸最大の宗教都市は全山炎上した。

  - id: nagashino
    date: "1575-06-29"
    title: 長篠の戦い
    category: 戦乱
    description: 織田・徳川連合軍が三段撃ちで知られる鉄砲戦法で武田勝頼軍を撃破した。

  - id: shibata-echizen
    date: "1575"
    title: 柴田勝家、越前国主に
    category: 政治
    description: 越前一向一揆鎮圧の功により、柴田勝家が信長から越前一国を与えられ北ノ庄城を本拠とした。北陸方面軍の司令官となった。

  - id: tedorigawa
    date: "1577"
    title: 手取川の戦い
    category: 戦乱
    description: 加賀に侵攻した柴田勝家率いる織田北陸方面軍が、上杉謙信の軍勢に大敗した。

  - id: mitsuhide-tanba
    date: "1579"
    title: 明智光秀、丹波平定
    category: 戦乱
    description: 八上城の波多野秀治を降伏させるなど数年がかりの攻略を経て、明智光秀が丹波・丹後を平定した。

  - id: kizugawaguchi-1
    date: "1576-07"
    title: 第一次木津川口の戦い
    category: 戦乱
    description: 石山本願寺への補給を阻止する織田水軍 300 艘に対し、毛利輝元が派遣した毛利水軍と村上武吉ら能島・来島の村上水軍 800 艘が大坂湾木津川河口で迎撃。焙烙火矢で織田水軍を壊滅させ、石山本願寺への兵糧搬入に成功した。

  - id: kizugawaguchi-2
    date: "1578-11"
    title: 第二次木津川口の戦い
    category: 戦乱
    description: 信長の命で九鬼嘉隆が伊勢で建造した鉄甲船 6 隻(大鉄砲・大砲装備)が、再度押し寄せた毛利・村上水軍 600 艘を旗艦への斉射で撃退。制海権が織田方へ移り、石山本願寺の補給路は完全に絶たれた。

  - id: ishiyama-fall
    date: "1580"
    title: 石山本願寺退去
    category: 戦乱
    description: 11 年に及んだ石山合戦の末、本願寺顕如が大坂石山を退去して織田氏との和睦が成立した。

  - id: takeda-fall
    date: "1582"
    title: 天目山の戦い・武田氏滅亡
    category: 戦乱
    description: 織田・徳川連合軍に追い詰められた武田勝頼が天目山で自害し、甲斐源氏の名門武田氏が滅亡した。

  - id: takamatsu-water-attack
    date: "1582"
    title: 備中高松城水攻め
    category: 戦乱
    description: 中国攻めの羽柴秀吉が備中高松城を堤防で囲い水没させた。本能寺の変直後に毛利氏と和睦し、中国大返しへ繋がった。

  - id: honnoji
    date: "1582-06-21"
    title: 本能寺の変
    category: 戦乱
    description: 中国攻め援軍に向かう途上の明智光秀が京都本能寺の織田信長を急襲し、信長を自害に追い込んだ。

  - id: yamazaki
    date: "1582-07-02"
    title: 山崎の戦い
    category: 戦乱
    description: 中国大返しで取って返した羽柴秀吉が山城山崎で明智光秀を撃破。光秀は敗走中に小栗栖で討たれ、十三日天下と称された。

  - id: motoaki-death
    date: "1582-07-19"
    title: 武田元明誅殺・若狭武田氏滅亡
    category: 政治
    description: 本能寺の変直後、若狭再興を狙った武田元明は明智光秀・義弟京極高次と結んで近江へ出兵し、丹羽長秀の本拠佐和山城を一時占領。だが山崎合戦で光秀が敗れると形勢は一変し、長秀のもとへ出頭した元明は近江海津の宝幢院で誅殺された(秀吉の命とも長秀の決断とも伝わる)。1440 年信栄の若狭守護就任から約 140 年続いた若狭武田氏はここに完全に滅亡した。

  - id: kiyosu-conference
    date: "1582"
    title: 清洲会議
    category: 政治
    description: 信長の後継と遺領分配を決めた重臣会議。秀吉が信忠の遺児三法師を擁立し、柴田勝家との対立が決定的になった。

  - id: shizugatake
    date: "1583-06-11"
    title: 賤ヶ岳の戦い
    category: 戦乱
    description: 近江賤ヶ岳付近で羽柴秀吉が柴田勝家を破り、織田家中の主導権を掌握した。賤ヶ岳の七本槍の活躍で知られる。

  - id: kitanosho-fall
    date: "1583-06-14"
    title: 北ノ庄城落城・柴田勝家自害
    category: 戦乱
    description: 賤ヶ岳の敗戦から越前に撤退した柴田勝家は、北ノ庄城に妻お市の方とともに籠もり、城に火を放って自害した。

  - id: niwa-echizen
    date: "1583"
    title: 丹羽長秀、越前北ノ庄入封
    category: 政治
    description: 賤ヶ岳・北ノ庄合戦の論功行賞で、信長以来の宿老丹羽長秀が既領の若狭に加えて越前一国と加賀の能美・江沼 2 郡を与えられ、計約 123 万石の大大名となる。柴田勝家亡き北陸方面の押さえとして北ノ庄城に入り、織田旧臣としては最大級の所領を握った。

  - id: heisenji-revival
    date: "1583"
    title: 平泉寺再興
    category: 文化
    description: 一向一揆で全山焼失後 10 年間身を隠していた玄成院顕海が、弟子の仙海・日海とともに旧境内の一角に堂塔を再建。豊臣秀吉から寺領安堵の朱印状を得て小規模ながら復興を遂げた。ただし戦国期最盛期の宗教都市としての姿は二度と戻らず、近世の平泉寺は寺勢を大幅に縮小したまま明治の神仏分離まで存続する。

  - id: osaka-castle
    date: "1583"
    title: 大坂城築城開始
    category: 文化
    description: 石山本願寺跡地に羽柴秀吉が大坂城の築城を開始し、新たな政権の本拠と定めた。

  - id: komaki-nagakute
    date: "1584"
    title: 小牧・長久手の戦い
    category: 戦乱
    description: 織田信雄を擁する徳川家康と羽柴秀吉が尾張・三河方面で対峙。戦闘では徳川方が優勢だったが、最終的に秀吉と和睦した。

  - id: suemori
    date: "1584"
    title: 末森城の戦い
    category: 戦乱
    description: 越中の佐々成政が能登末森城を急襲したが、加賀の前田利家が後詰に駆けつけて撃退。北陸の主導権が前田に傾いた。

  - id: sarasara-goe
    date: "1584"
    title: 佐々成政のさらさら越え
    category: 戦乱
    description: 反秀吉包囲網の再構築を期した佐々成政が、厳冬の北アルプス立山連峰を越えて浜松の徳川家康に再戦を説いた。

  - id: shikoku-pacification
    date: "1585"
    title: 四国平定
    category: 戦乱
    description: 羽柴秀吉が弟秀長らを派遣し、長宗我部元親を降伏させて四国を平定した。

  - id: kanpaku
    date: "1585"
    title: 秀吉関白就任
    category: 政治
    description: 近衛家の猶子となった羽柴秀吉が朝廷から関白に任じられ、武家として初めて関白の職に就いた。

  - id: toyama-attack
    date: "1585"
    title: 富山の役
    category: 戦乱
    description: 羽柴秀吉が 10 万の大軍で越中佐々成政を攻めた。成政は剃髪して降伏し、新川郡一郡を残してほぼ全所領を没収された。

  - id: kanamori-hida
    date: "1585"
    title: 金森長近、飛騨平定
    category: 戦乱
    description: 富山の役と並行して、金森長近が飛騨の三木 (姉小路) 頼綱を破り飛騨国を平定。秀吉から飛騨一国を与えられた。

  - id: toyotomi-name
    date: "1586"
    title: 豊臣姓下賜・太政大臣就任
    category: 政治
    description: 羽柴秀吉が朝廷から「豊臣」の姓を賜り太政大臣に任じられた。

  - id: niwa-nagahide-death
    date: "1585-04"
    title: 丹羽長秀死去・長重大幅減封
    category: 政治
    description: 越前北ノ庄で長秀が病没(享年 51。寸白(寄生虫)による積病で自害したとも伝わる)。家督を継いだ嫡男長重 15 歳は越中佐々成政攻めの際の家臣の不行跡を口実に、秀吉から越前と加賀 2 郡を召し上げられ、若狭一国 15 万石に減封された。

  - id: niwa-nagashige-komatsu
    date: "1587"
    title: 丹羽長重、加賀松任 4 万石に再減封
    category: 政治
    description: 九州平定従軍中の家臣の軍律違反を理由に、秀吉が丹羽長重から若狭をも取り上げて加賀松任 4 万石へ移封。信長旧臣として最大の所領を誇った丹羽家は、長秀死後 2 年で約 30 分の 1 にまで削減された。秀吉が信長の宿老格を徹底的に抑え込む路線の象徴的事例。

  - id: kyushu-pacification
    date: "1587"
    title: 九州平定
    category: 戦乱
    description: 島津氏討伐のため秀吉自ら大軍を率いて九州に出陣し、島津義久を降伏させた。毛利・小早川勢も主力として従軍した。

  - id: higo-ikki
    date: "1587"
    title: 肥後国人一揆
    category: 戦乱
    description: 九州平定後、肥後一国を与えられた佐々成政の急速な検地が反発を招き、国人衆が大規模な一揆を起こした。

  - id: bateren-edict
    date: "1587-07-24"
    title: バテレン追放令
    category: 外交
    description: 九州平定の最中、秀吉が筑前博多でキリスト教宣教師の国外追放を命じる伴天連追放令を発布した。

  - id: sasa-seppuku
    date: "1588"
    title: 佐々成政切腹
    category: 政治
    description: 肥後国人一揆の責任を問われた佐々成政が、摂津尼崎の法園寺で切腹を命じられ生涯を閉じた。

  - id: katanagari
    date: "1588"
    title: 刀狩令
    category: 政治
    description: 秀吉が農民から武器を没収する刀狩令を発布。兵農分離が制度的に進んだ。

  - id: takayama-castle
    date: "1588"
    title: 高山城築城開始
    category: 文化
    description: 飛騨を与えられた金森長近が高山城および城下町の整備に着手した。城下は近世高山の原型となる。

  - id: sanuki-takamatsu-castle
    date: "1588"
    title: 讃岐高松城築城
    category: 文化
    description: 四国平定後に讃岐一国を与えられた生駒親正が、瀬戸内海に面した玉藻浦に水城形式の高松城を築く。海水を堀に引き込み城内まで船を寄せられる「海城」で、日本三大水城の一つに数えられる。別名玉藻城。城下町は瀬戸内の交易拠点として整備され、近世高松の原型となった。

  - id: hiroshima-castle
    date: "1589"
    title: 広島城築城開始
    category: 文化
    description: 太閤検地を経て、毛利輝元が太田川河口の三角州に広島城の築城を開始し、安芸吉田郡山城から本拠を移した。

  - id: odawara
    date: "1590"
    title: 小田原征伐
    category: 戦乱
    description: 秀吉が後北条氏の本拠小田原城を約 20 万の大軍で包囲。籠城 3 か月を経て北条氏政・氏直が降伏した。

  - id: tenkatouitsu
    date: "1590"
    title: 奥州仕置・天下統一
    category: 政治
    description: 小田原開城後、秀吉が会津で奥羽の大名の領地を裁定し、応仁の乱以来続いた戦国の世を終結させた。

  - id: rikyu-seppuku
    date: "1591-04-21"
    title: 千利休切腹
    category: 文化
    description: 秀吉の不興を買った茶聖・千利休が京都聚楽屋敷で切腹を命じられた。わび茶の体系は弟子達に継承された。

  - id: bunroku-no-eki
    date: "1592"
    title: 文禄の役
    category: 戦乱
    description: 秀吉が明征服を掲げて朝鮮半島に出兵。緒戦は優勢だったが、明軍参戦と李舜臣の水軍活躍で戦局は膠着した。

  - id: keicho-no-eki
    date: "1597"
    title: 慶長の役
    category: 戦乱
    description: 文禄の役の和議決裂を受け、秀吉が再び朝鮮へ出兵。秀吉死去にともなう撤退まで戦闘が続いた。

  - id: hideyoshi-death
    date: "1598-09-18"
    title: 豊臣秀吉死去
    category: 政治
    description: 京都伏見城で豊臣秀吉が没した。五大老五奉行体制で遺児秀頼の補佐が委ねられたが、徳川家康台頭の伏線となった。
